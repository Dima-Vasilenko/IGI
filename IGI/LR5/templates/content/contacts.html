{% extends 'base.html' %}

{% block content %}

<h2>Контакты</h2>

{% for item in employees %}

    <hr>

    <p>
        {{ item.full_name }}
    </p>

    <p>
        {{ item.position }}
    </p>

    <p>
        {{ item.phone }}
    </p>

    <p>
        {{ item.email }}
    </p>

    <p>
        {{ item.responsibilities }}
    </p>

    <img src="{{ item.photo.url }}" width="250" height="250">

{% endfor %}

{% endblock %}
