{% extends 'base.html' %}

{% block content %}

<h2>Главная страница</h2>

{% if latest_news %}
    <h3>{{ latest_news.title }}</h3>
    <p>{{ latest_news.short_description }}</p>
    <img src="{{ latest_news.image.url }}" width="250" height="250">

{% else %}
    <p>Новостей пока нет</p>
{% endif %}

{% endblock %}
